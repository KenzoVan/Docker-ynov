version: '3.8'

services:
  web-nginx:
    build:
      context: ./web-nginx
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    stop_grace_period: 10s

  frontend-vue:
    build:
      context: ./front-vue
    ports:
      - "3000:3000"
    depends_on:
      - web-nginx
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    stop_grace_period: 10s

  backend-symfony:
    build:
      context: ./back-symfony
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.20'
          memory: 64M
    stop_grace_period: 15s

  ci-lint:
    build:
      context: ./ci-lint
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  ci-test:
    build:
      context: ./ci-test
    depends_on:
      backend-symfony:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
